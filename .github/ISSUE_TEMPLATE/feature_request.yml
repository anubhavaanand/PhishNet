name: ✨ Feature Request
description: Suggest a new feature for PhishNet
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! PhishNet is privacy-first — all features must maintain zero data collection.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Detection Improvement (accuracy, new signals)
        - New Email Provider (Yahoo, Proton, etc.)
        - UI/UX Enhancement
        - Performance Optimization
        - Privacy/Compliance
        - Developer Experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Who benefits?
      placeholder: "Users want to detect phishing in Yahoo Mail too..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Technical approach?
      placeholder: "Add Yahoo Mail selectors and host permissions..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought of
      placeholder: "Could use a separate model for Yahoo, or generic selectors..."

  - type: checkboxes
    id: privacy-impact
    attributes:
      label: Privacy Impact Assessment
      description: PhishNet is privacy-first. Check all that apply.
      options:
        - label: No new network requests for email content
          required: true
        - label: No new data stored externally
          required: true
        - label: No new permissions required (or justified in PR)
        - label: User can disable/opt-out
        - label: Works offline (after model load)

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes
      description: Any technical details, files to modify, risks
      placeholder: "Would need to add yahoo.com to host_permissions, create selectors.yahoo.js..."

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High (critical for hackathon/competition)
        - Medium (valuable improvement)
        - Low (nice to have)
    validations:
      required: true