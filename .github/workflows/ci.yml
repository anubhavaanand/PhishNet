name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check manifest.json validity
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            console.log('Manifest version:', manifest.manifest_version);
            console.log('Name:', manifest.name);
            console.log('Version:', manifest.version);
            // Required fields check
            const required = ['manifest_version', 'name', 'version', 'description', 'icons', 'background', 'content_scripts', 'permissions'];
            for (const field of required) {
              if (!manifest[field]) {
                console.error('Missing required field:', field);
                process.exit(1);
              }
            }
            console.log('✅ Manifest valid');
          "

      - name: Check JavaScript syntax
        run: |
          for f in src/background.js src/offscreen.js src/popup.js src/utils/logger.js; do
            echo "Checking module $f..."
            node --check --input-type=module < "$f" || exit 1
          done
          for f in src/selectors.js src/utils/error-boundary.js src/utils/heuristic-detector.js src/content.js; do
            echo "Checking script $f..."
            node --check "$f" || exit 1
          done
          echo "✅ All JavaScript files have valid syntax"

      - name: Check for console.log in production code
        run: |
          if grep -r "console\.log" src/ --include="*.js" | grep -v "console\.error\|console\.warn\|IS_DEBUG"; then
            echo "❌ Found raw console.log in production code"
            exit 1
          else
            echo "✅ No unshielded console.log in production code"
          fi

      - name: Check CSP compliance (no inline scripts)
        run: |
          # Check HTML files for inline scripts
          if grep -r "<script>" src/ --include="*.html" | grep -v "type=\"module\""; then
            echo "❌ Found inline script without type=module"
            exit 1
          fi
          # Check for eval/Function constructor
          if grep -r "eval(\|new Function" src/ --include="*.js"; then
            echo "❌ Found eval() or new Function()"
            exit 1
          fi
          # Validate MV3 extension_pages CSP: only 'self', wasm-unsafe-eval, wasm-eval allowed
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const csp = m.content_security_policy.extension_pages;
            const S = (s) => \"'\" + s + \"'\";
            const allowed = {
              'script-src': [S('self'), S('wasm-unsafe-eval'), S('wasm-eval'), S('inline-speculation-rules'), S('none')],
              'object-src': [S('self'), S('none')],
              'worker-src': [S('self'), S('none')]
            };
            let errors = [];
            for (const d of csp.split(';').map(x => x.trim().split(/\s+/)).filter(x => x.length)) {
              const [name, ...vals] = d;
              if (!(name in allowed)) { errors.push('Unknown directive: ' + name); continue; }
              for (const v of vals) {
                if (/^https?:\/\//.test(v)) errors.push('Remote URL in ' + name + ': ' + v);
                else if (!allowed[name].includes(v)) errors.push('Disallowed value ' + v + ' in ' + name);
              }
            }
            if (errors.length) { console.error('❌ MV3 CSP violation:\n - ' + errors.join('\n - ')); process.exit(1); }
            console.log('✅ MV3 CSP compliant: ' + csp);
          "
          echo "✅ CSP compliant"

  validate:
    name: Validate Extension Structure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # dist/ is gitignored, so it must be built before the manifest-reference
      # check below can be meaningful. Without this the check fails on every
      # push even when the manifest is correct.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build extension UI
        run: npm run build

      - name: Verify required files exist
        run: |
          required_files=(
            "manifest.json"
            "src/background.js"
            "src/content.js"
            "src/offscreen.js"
            "src/popup.html"
            "src/popup.js"
            "src/selectors.js"
            "src/styles.css"
            "src/utils/logger.js"
            "src/utils/error-boundary.js"
            "src/utils/heuristic-detector.js"
            "public/offscreen.html"
            "public/icons/icon-16.png"
            "public/icons/icon-32.png"
            "public/icons/icon-48.png"
            "public/icons/icon-128.png"
            "LICENSE"
            "PRIVACY_POLICY.md"
            "README.md"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          echo "✅ All required files present"

      - name: Validate manifest.json references
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            
            // Check icon files exist
            for (const [size, path] of Object.entries(manifest.icons)) {
              if (!fs.existsSync(path)) {
                console.error('Missing icon:', path);
                process.exit(1);
              }
            }
            
            // Check content script files
            for (const cs of manifest.content_scripts) {
              for (const js of cs.js) {
                if (!fs.existsSync(js)) {
                  console.error('Missing content script:', js);
                  process.exit(1);
                }
              }
              for (const css of cs.css || []) {
                if (!fs.existsSync(css)) {
                  console.error('Missing content style:', css);
                  process.exit(1);
                }
              }
            }
            
            // Check background
            if (!fs.existsSync(manifest.background.service_worker)) {
              console.error('Missing background script');
              process.exit(1);
            }
            
            // Check offscreen HTML page
            if (!fs.existsSync('public/offscreen.html')) {
              console.error('Missing offscreen page');
              process.exit(1);
            }
            
            // Check action popup
            if (!fs.existsSync(manifest.action.default_popup)) {
              console.error('Missing popup HTML');
              process.exit(1);
            }
            
            console.log('✅ All manifest references valid');
          "

      # A page can exist while referencing assets that do not resolve. That is
      # exactly the "blank popup" failure: manifest check passes, popup is dead.
      - name: Verify built pages reference existing assets
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const pages = [manifest.action.default_popup, manifest.options_page].filter(Boolean);
            let bad = 0;
            for (const page of pages) {
              if (!fs.existsSync(page)) { console.error('❌ page missing:', page); bad++; continue; }
              const html = fs.readFileSync(page, 'utf8');
              const refs = [...html.matchAll(/(?:src|href)=\"([^\"]+)\"/g)].map(m => m[1]);
              for (const ref of refs) {
                if (/^(https?:)?\/\//.test(ref)) { console.error('❌ remote URL in', page, ref); bad++; continue; }
                const target = path.resolve(path.dirname(page), ref);
                if (!fs.existsSync(target)) { console.error('❌ broken ref:', page, '->', ref); bad++; }
              }
              console.log('✅ ' + page + ' references ' + refs.length + ' local asset(s)');
            }
            process.exit(bad ? 1 : 0);
          "

      - name: Check icon dimensions
        run: |
          for size in 16 32 48 128; do
            file "public/icons/icon-${size}.png" | grep -q "${size} x ${size}" || {
              echo "❌ Icon ${size}px has wrong dimensions"
              exit 1
            }
          done
          echo "✅ All icons have correct dimensions"

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # pretest builds dist/, which tests/package.test.js asserts against.
      - name: Run Unit Tests
        run: npm test

  package:
    name: Package Extension
    runs-on: ubuntu-24.04
    needs: [lint, validate, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json')).version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # dist/ is gitignored, so the packaged extension needs a fresh build.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build extension UI
        run: npm run build

      - name: Create extension zip
        run: |
          zip -r "phishnet-v${{ steps.version.outputs.version }}.zip" \
            manifest.json \
            src/ \
            public/ \
            vendor/ \
            dist/ \
            LICENSE \
            PRIVACY_POLICY.md \
            README.md \
            -x "*.git*" "node_modules/*" "doc/*" ".gitignore" ".DS_Store" "generate_*" ".github/*" "tests/*" "public/test-emails.html"

      - name: Verify zip contents
        run: |
          unzip -l "phishnet-v${{ steps.version.outputs.version }}.zip"
          # The manifest points here; a zip without it ships a broken extension.
          for page in $(node -e "const m=require('./manifest.json');console.log([m.action.default_popup,m.options_page].filter(Boolean).join(' '))"); do
            unzip -l "phishnet-v${{ steps.version.outputs.version }}.zip" | grep -q "$page" || {
              echo "❌ packaged zip is missing $page"; exit 1;
            }
          done
          echo "✅ packaged zip contains every page the manifest references"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: phishnet-extension
          path: "phishnet-v${{ steps.version.outputs.version }}.zip"
          retention-days: 30