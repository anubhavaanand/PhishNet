name: Issue assignment

# Self-assignment for issues, since GitHub will not assign non-collaborators
# (isaacs/github#100). Claim by commenting `/assign-me`, release with
# `/release`. The decision table lives in .github/scripts/assign.js and is
# covered by tests/assign.test.js.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  # Two /assign-me comments racing must not both pass the cap check.
  group: assign-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign:
    name: Assign or release
    # Every comment on every issue and PR fires this workflow. A job-level `if`
    # is evaluated before a runner is allocated, so a false result costs nothing
    # while a job that starts, checks out, installs Node and then finds no
    # command costs a full run. Testing for the command here keeps ordinary
    # conversation off the runner entirely.
    #
    # This is a pre-filter, not the authority: the script still validates the
    # body with a word-boundary regex, so a comment that merely mentions a
    # command starts a runner that then exits. That is the safe direction to be
    # wrong in — a tight guard that silently dropped a valid command would be
    # worse than an occasional wasted run. (GitHub expressions have no `trim`,
    # so a whitespace-tolerant startsWith is not available.)
    # tests/assign.test.js asserts every command the script accepts appears here.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      (
        contains(lower(github.event.comment.body), '/assign') ||
        contains(lower(github.event.comment.body), '/claim') ||
        contains(lower(github.event.comment.body), '/take') ||
        contains(lower(github.event.comment.body), '/release') ||
        contains(lower(github.event.comment.body), '/unassign') ||
        contains(lower(github.event.comment.body), '/stop') ||
        contains(lower(github.event.comment.body), '/drop') ||
        contains(lower(github.event.comment.body), '/unclaim')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run the assignment bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node .github/scripts/assign.js