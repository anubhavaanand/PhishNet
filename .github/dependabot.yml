# Dependabot Configuration
# Automated dependency updates for dev dependencies

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci):"
    open-pull-requests-limit: 5

  # Docker (if we add container later)
  # - package-ecosystem: "docker"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"

  # npm (for dev dependencies like icon generation)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    # These move as a set: react and react-dom must share a major, and vite
    # and @vitejs/plugin-react must too. One PR per package produced four
    # individually-unmergeable halves (react 19 against react-dom 18, vite 8
    # against plugin-react 4) that each failed ERESOLVE on install.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "vitest"
